name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'tools/passcheck/**'
      - '.github/workflows/deploy-passcheck.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy passcheck to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./tools/passcheck
        run: npm install

      - name: Build Project
        run: npm run build
        working-directory: ./tools/passcheck

      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "./tools/passcheck"
          command: "pages deploy --directory=dist --project-name=passcheck"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}